<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <!-- Spherical 3D shading -->
        <radialGradient id="sphereShading" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="30%" stop-color="#d5bdfc" stop-opacity="0.65" />
            <stop offset="70%" stop-color="#7b2cbf" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#0b071a" stop-opacity="0.95" />
        </radialGradient>
        
        <!-- Glitter Glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Mask to crop the grid into a sphere -->
        <clipPath id="sphereClip">
            <circle cx="60" cy="65" r="40" />
        </clipPath>
        
        <!-- Animation for sparkling colors -->
        <style>
            @keyframes discoSpin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes sparkle {
                0%, 100% { opacity: 0.3; transform: scale(0.6); }
                50% { opacity: 1; transform: scale(1.3); }
            }
            @keyframes facetFlash {
                0%, 100% { fill-opacity: 0.2; }
                50% { fill-opacity: 0.85; }
            }
            .spinning-grid {
                transform-origin: 60px 65px;
                animation: discoSpin 16s linear infinite;
            }
            .sparkle-1 { animation: sparkle 2.5s ease-in-out infinite; transform-origin: 35px 45px; }
            .sparkle-2 { animation: sparkle 1.8s ease-in-out infinite 0.5s; transform-origin: 85px 50px; }
            .sparkle-3 { animation: sparkle 2.2s ease-in-out infinite 0.9s; transform-origin: 55px 90px; }
            .sparkle-4 { animation: sparkle 1.5s ease-in-out infinite 1.2s; transform-origin: 60px 30px; }
            .flash-cell { animation: facetFlash 2.5s infinite ease-in-out; }
            .flash-cell-delayed { animation: facetFlash 3.5s infinite ease-in-out 1.2s; }
        </style>
    </defs>

    <!-- Hanging chain and loop -->
    <path d="M60,0 L60,25" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1.5 3" />
    <circle cx="60" cy="25" r="5" fill="none" stroke="#e5b93c" stroke-width="2" />
    
    <!-- Outer Glow behind ball -->
    <circle cx="60" cy="65" r="42" fill="#9d4edd" opacity="0.18" filter="url(#glow)" />
    
    <!-- Sphere Base -->
    <circle cx="60" cy="65" r="40" fill="#150e2e" stroke="#e5b93c" stroke-width="1.2" />
    
    <!-- Spinning Faceted Grid (Clips into Sphere) -->
    <g clip-path="url(#sphereClip)">
        <!-- Underlying color layout -->
        <circle cx="60" cy="65" r="40" fill="url(#sphereShading)" />
        
        <!-- Facet pattern group spinning -->
        <g class="spinning-grid">
            <!-- Curved vertical lines for sphere grid -->
            <path d="M20,65 Q35,15 60,25 Q45,65 20,65 Z" fill="#9d4edd" class="flash-cell" fill-opacity="0.3" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
            <path d="M60,25 Q75,15 90,25 Q100,65 60,65 Z" fill="#ff007f" class="flash-cell-delayed" fill-opacity="0.3" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
            
            <!-- Spherical grid lines -->
            <!-- Longitudes -->
            <path d="M20,65 A 40 40 0 0 1 100,65" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" />
            <path d="M20,65 A 40 30 0 0 1 100,65" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M20,65 A 40 15 0 0 1 100,65" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M20,65 A 40 30 0 0 0 100,65" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M20,65 A 40 15 0 0 0 100,65" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            
            <!-- Latitudes -->
            <path d="M60,25 A 40 40 0 0 1 60,105" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" />
            <path d="M60,25 A 30 40 0 0 1 60,105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M60,25 A 15 40 0 0 1 60,105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M60,25 A 30 40 0 0 0 60,105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            <path d="M60,25 A 15 40 0 0 0 60,105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5" />
            
            <!-- Individual shining mirror facets -->
            <rect x="55" y="45" width="8" height="6" fill="#e5b93c" class="flash-cell" fill-opacity="0.5" />
            <rect x="70" y="55" width="7" height="7" fill="#ffffff" class="flash-cell-delayed" fill-opacity="0.6" />
            <rect x="42" y="70" width="6" height="6" fill="#ff007f" class="flash-cell" fill-opacity="0.7" />
            <rect x="80" y="75" width="8" height="6" fill="#9d4edd" class="flash-cell-delayed" fill-opacity="0.6" />
            <rect x="58" y="85" width="6" height="6" fill="#e5b93c" class="flash-cell" fill-opacity="0.5" />
        </g>
        
        <!-- 3D Shading overlay -->
        <circle cx="60" cy="65" r="40" fill="url(#sphereShading)" style="mix-blend-mode: overlay; pointer-events: none;" />
    </g>
    
    <!-- Sparkles / Glint Stars -->
    <!-- Sparkle 1 (Top Left) -->
    <path class="sparkle-1" d="M35,45 L37,42 L45,45 L37,48 Z M35,45 L32,45 L35,37 L35,53 Z" fill="#ffffff" filter="url(#glow)" />
    <!-- Sparkle 2 (Right) -->
    <path class="sparkle-2" d="M85,50 L87,46 L95,50 L87,54 Z M85,50 L81,50 L85,41 L85,59 Z" fill="#ff007f" filter="url(#glow)" />
    <!-- Sparkle 3 (Bottom) -->
    <path class="sparkle-3" d="M55,90 L56,87 L62,90 L56,93 Z M55,90 L51,90 L55,83 L55,97 Z" fill="#e5b93c" filter="url(#glow)" />
    <!-- Sparkle 4 (Top) -->
    <path class="sparkle-4" d="M60,30 L61,27 L67,30 L61,33 Z M60,30 L56,30 L60,23 L60,37 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
